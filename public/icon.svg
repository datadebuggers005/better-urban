<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>OCOR — Our City, Our Responsibility</title>
  <!-- Crisp rounded emblem surface using OCOR Surface Container & Outline Variant -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="#ffffff" stroke="#d4e4f6" stroke-width="1.5" />

  <defs>
    <clipPath id="ocor-ring-inner">
      <circle cx="32" cy="31" r="19" />
    </clipPath>
  </defs>

  <!-- Civic orange sunrise protective arc inside top of ring (PIL-sampled #f97514) -->
  <path
    d="M17.5 27.5 C21.5 18.5, 41.5 18.5, 45.5 26.5 C39.5 21.8, 24.5 22.0, 17.5 27.5 Z"
    fill="#f97514"
  />

  <!-- Skyline & roadway silhouettes clipped to ring interior (PIL-sampled #06294e) -->
  <g clip-path="url(#ocor-ring-inner)">
    <rect x="17.5" y="31" width="4.5" height="12" fill="#06294e" />
    <rect x="22.8" y="26.5" width="5" height="16.5" fill="#06294e" />
    <path d="M28.6 24.5 L33.6 22.5 L33.6 43 L28.6 43 Z" fill="#06294e" />
    <rect x="34.5" y="27.5" width="4.8" height="15.5" fill="#06294e" />
    <rect x="40.1" y="32" width="4.2" height="11" fill="#06294e" />

    <!-- Skyline window cutouts -->
    <rect x="19" y="33" width="1.4" height="1.5" fill="#ffffff" />
    <rect x="24.5" y="28.5" width="1.5" height="1.6" fill="#ffffff" />
    <rect x="24.5" y="31.5" width="1.5" height="1.6" fill="#ffffff" />
    <rect x="30.2" y="25.5" width="1.6" height="1.6" fill="#ffffff" />
    <rect x="30.2" y="28.5" width="1.6" height="1.6" fill="#ffffff" />
    <rect x="30.2" y="31.5" width="1.6" height="1.6" fill="#ffffff" />
    <rect x="36.1" y="29.5" width="1.5" height="1.5" fill="#ffffff" />
    <rect x="36.1" y="32.5" width="1.5" height="1.5" fill="#ffffff" />

    <!-- Curving civic roadway white separator & road ribbon -->
    <path d="M12 43.5 Q27 35.5 49 36.5 L52 49 L12 49 Z" fill="#ffffff" />
    <path d="M14 45.5 Q28 38.2 48 37.8 Q31 40.5 19 48.5 Z" fill="#06294e" />
    <path d="M23.5 49 Q34 41.5 48.5 39.8 Q37 43.5 29.5 50 Z" fill="#06294e" />
  </g>

  <!-- Deep navy civic O-ring (PIL-sampled #06294e) -->
  <circle cx="32" cy="31" r="20.5" stroke="#06294e" stroke-width="5.2" />

  <!-- Ascending eco-green pathway/leaf swoosh across lower-right (PIL-sampled #509d38) -->
  <path
    d="M32.5 53.5 C38 45.5, 46.5 41.2, 56 41.5 C48.5 43.2, 42.5 47.2, 38.8 54.5 Z"
    fill="#509d38"
    stroke="#ffffff"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Civic orange map-pin badge on upper-right rim (PIL-sampled #f97514) -->
  <path
    d="M49 9.5 C45.4 9.5 42.5 12.4 42.5 16 C42.5 20.6 49 26.8 49 26.8 C49 26.8 55.5 20.6 55.5 16 C55.5 12.4 52.6 9.5 49 9.5 Z"
    fill="#f97514"
    stroke="#ffffff"
    stroke-width="1.4"
  />
  <circle cx="49" cy="15.8" r="2.3" fill="#ffffff" />
</svg>
